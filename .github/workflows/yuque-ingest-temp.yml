name: Yuque ingest temp

on:
  push:
    branches:
      - codex/yuque-ingest-temp
    paths:
      - '.github/workflows/yuque-ingest-temp.yml'
      - 'tools/yuque_ingest.py'
  workflow_dispatch:

jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Playwright
        run: |
          python -m pip install --upgrade pip
          pip install playwright
          python -m playwright install --with-deps chromium

      - name: Crawl Yuque
        run: python tools/yuque_ingest.py

      - name: Upload crawl artifact
        uses: actions/upload-artifact@v4
        with:
          name: yuque-dump
          path: |
            yuque_dump/
            yuque_dump.zip
          if-no-files-found: error
          retention-days: 3
